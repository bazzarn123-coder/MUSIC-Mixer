<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Mix Remix Studio - Independent Deck Controls</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        input[type="range"] { accent-color: #3b82f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2.5 rounded-xl text-xl shadow">🎛️</div>
            <div>
                <h1 class="text-lg md:text-xl font-black tracking-wider bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">MEGA MIX REMIX STUDIO</h1>
                <p class="text-xs text-slate-400">Independent Deck Play/Pause & Live Beat-Matching</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="exportMix()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-bold transition shadow-md text-sm flex items-center space-x-2">
                <span>💾</span><span>Export Mix</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 max-w-7xl mx-auto w-full">
        
        <!-- Left Column: Track Library & Upload -->
        <div class="lg:col-span-1 bg-slate-800/40 border border-slate-700/60 rounded-2xl p-4 flex flex-col space-y-4 backdrop-blur-sm">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300 border-b border-slate-700 pb-2">1. Track Library</h2>
            
            <!-- Upload Box -->
            <label class="border-2 border-dashed border-slate-600 hover:border-blue-500 rounded-xl p-5 text-center cursor-pointer transition block bg-slate-900/40 group">
                <input type="file" id="audio-file-input" accept="audio/*" multiple class="hidden" onchange="handleFileUpload(event)">
                <div class="text-2xl mb-1 group-hover:scale-110 transition">📁</div>
                <p class="text-xs font-semibold text-slate-300">Upload Audio Tracks</p>
                <p class="text-[10px] text-slate-500 mt-0.5">MP3, WAV, M4A, FLAC</p>
            </label>

            <!-- Loaded Tracks List -->
            <div id="track-library" class="flex-1 overflow-y-auto space-y-2 max-h-[350px] pr-1">
                <p class="text-xs text-slate-500 text-center py-8">No tracks uploaded yet. Add files to begin.</p>
            </div>
        </div>

        <!-- Right Column: DJ Decks & Independent Controls -->
        <div class="lg:col-span-3 flex flex-col space-y-6">
            
            <!-- Dual Deck Setup -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- Deck A -->
                <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 flex flex-col justify-between space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
                        <span class="text-xs font-bold px-2 py-0.5 bg-blue-500/20 text-blue-400 rounded-md border border-blue-500/30">DECK A</span>
                        <span id="deck-a-name" class="text-xs font-medium text-slate-400 truncate max-w-[160px]">No track loaded</span>
                    </div>
                    <div class="space-y-3">
                        <div>
                            <label class="text-[10px] text-slate-400 block mb-1">Estimated BPM: <span id="deck-a-bpm" class="text-slate-200 font-bold">120</span></label>
                            <input type="range" id="deck-a-speed" min="0.7" max="1.3" step="0.01" value="1.0" oninput="updateDeckSpeed('A', this.value)" class="w-full">
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] text-slate-400">Volume</span>
                            <input type="range" id="deck-a-vol" min="0" max="1" step="0.05" value="1.0" oninput="updateDeckVolume('A', this.value)" class="w-28">
                        </div>
                        <div class="flex space-x-2 pt-2">
                            <button onclick="toggleDeckPlay('A')" id="deck-a-play-btn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-xl transition">
                                ▶ Play Deck A
                            </button>
                            <button onclick="pauseDeck('A')" class="bg-amber-600/80 hover:bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-xl transition">
                                ⏸ Pause
                            </button>
                        </div>
                    </div>
                    <button onclick="loadToDeck('A')" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold py-1.5 rounded-xl transition">
                        Load Selected to Deck A
                    </button>
                </div>

                <!-- Deck B -->
                <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 flex flex-col justify-between space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
                        <span class="text-xs font-bold px-2 py-0.5 bg-indigo-500/20 text-indigo-400 rounded-md border border-indigo-500/30">DECK B</span>
                        <span id="deck-b-name" class="text-xs font-medium text-slate-400 truncate max-w-[160px]">No track loaded</span>
                    </div>
                    <div class="space-y-3">
                        <div>
                            <label class="text-[10px] text-slate-400 block mb-1">Estimated BPM: <span id="deck-b-bpm" class="text-slate-200 font-bold">120</span></label>
                            <input type="range" id="deck-b-speed" min="0.7" max="1.3" step="0.01" value="1.0" oninput="updateDeckSpeed('B', this.value)" class="w-full">
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] text-slate-400">Volume</span>
                            <input type="range" id="deck-b-vol" min="0" max="1" step="0.05" value="1.0" oninput="updateDeckVolume('B', this.value)" class="w-28">
                        </div>
                        <div class="flex space-x-2 pt-2">
                            <button onclick="toggleDeckPlay('B')" id="deck-b-play-btn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-xl transition">
                                ▶ Play Deck B
                            </button>
                            <button onclick="pauseDeck('B')" class="bg-amber-600/80 hover:bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-xl transition">
                                ⏸ Pause
                            </button>
                        </div>
                    </div>
                    <button onclick="loadToDeck('B')" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold py-1.5 rounded-xl transition">
                        Load Selected to Deck B
                    </button>
                </div>

            </div>

            <!-- Global Master Controls -->
            <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 flex flex-col md:flex-row justify-between items-center gap-4 shadow-xl">
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-200">Shared Beat Target (BPM)</h2>
                    <p class="text-[10px] text-slate-400">Both decks automatically scale their tempo relative to this target.</p>
                </div>
                <div class="flex items-center space-x-3 w-full md:w-auto">
                    <input type="number" id="target-bpm" value="122" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-white text-sm w-24 font-bold text-center">
                    <button onclick="stopAllPlayback()" class="bg-red-600/80 hover:bg-red-600 text-white font-semibold text-xs px-4 py-2 rounded-xl transition">
                        ⏹ Stop Everything
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Notification Banner -->
    <div id="notification" class="fixed bottom-4 right-4 bg-slate-900 border border-slate-700 text-slate-200 px-4 py-3 rounded-xl shadow-2xl hidden z-50 text-xs"></div>

    <script>
        let audioCtx = null;
        let libraryTracks = [];
        let selectedTrackId = null;

        // Deck state management supporting pause/resume offsets
        let deckA = {
            track: null,
            source: null,
            gainNode: null,
            isPlaying: false,
            pausedAt: 0,
            startedAt: 0,
            speed: 1.0,
            vol: 1.0,
            estimatedBpm: 120
        };

        let deckB = {
            track: null,
            source: null,
            gainNode: null,
            isPlaying: false,
            pausedAt: 0,
            startedAt: 0,
            speed: 1.0,
            vol: 1.0,
            estimatedBpm: 120
        };

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function showNotification(msg, duration = 3000) {
            const banner = document.getElementById('notification');
            banner.textContent = msg;
            banner.classList.remove('hidden');
            setTimeout(() => banner.classList.add('hidden'), duration);
        }

        async function handleFileUpload(event) {
            const files = event.target.files;
            if (!files.length) return;
            showNotification(`Importing ${files.length} file(s)...`);
            const ctx = getAudioContext();

            for (let file of files) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
                    const simulatedBpm = Math.floor(Math.random() * (130 - 112) + 112);

                    const track = {
                        id: 'tr_' + Math.random().toString(36).substr(2, 9),
                        name: file.name,
                        buffer: audioBuffer,
                        duration: audioBuffer.duration,
                        bpm: simulatedBpm
                    };

                    libraryTracks.push(track);
                    renderLibrary();
                    showNotification(`Successfully loaded: ${file.name}`);
                } catch (err) {
                    console.error(err);
                    showNotification(`Error decoding ${file.name}.`);
                }
            }
            event.target.value = '';
        }

        function renderLibrary() {
            const libEl = document.getElementById('track-library');
            if (libraryTracks.length === 0) {
                libEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">No tracks uploaded yet. Add files to begin.</p>`;
                return;
            }

            libEl.innerHTML = libraryTracks.map(t => `
                <div onclick="selectTrack('${t.id}')" class="bg-slate-900/70 border ${selectedTrackId === t.id ? 'border-blue-500 bg-blue-950/30' : 'border-slate-800'} hover:border-slate-600 p-2.5 rounded-xl cursor-pointer transition flex items-center justify-between">
                    <div class="overflow-hidden mr-2">
                        <p class="text-xs font-semibold text-slate-200 truncate">${t.name}</p>
                        <p class="text-[10px] text-slate-400">${t.duration.toFixed(1)}s • ~${t.bpm} BPM</p>
                    </div>
                    <span class="text-xs">${selectedTrackId === t.id ? '📍' : ''}</span>
                </div>
            `).join('');
        }

        function selectTrack(id) {
            selectedTrackId = id;
            renderLibrary();
        }

        function loadToDeck(deckLetter) {
            if (!selectedTrackId) {
                showNotification("Please select a track from the library first.");
                return;
            }
            const track = libraryTracks.find(t => t.id === selectedTrackId);
            if (!track) return;

            if (deckLetter === 'A') {
                stopDeck('A');
                deckA.track = track;
                deckA.pausedAt = 0;
                deckA.estimatedBpm = track.bpm;
                document.getElementById('deck-a-name').textContent = track.name;
                document.getElementById('deck-a-bpm').textContent = track.bpm;
                showNotification(`Loaded "${track.name}" into Deck A`);
            } else {
                stopDeck('B');
                deckB.track = track;
                deckB.pausedAt = 0;
                deckB.estimatedBpm = track.bpm;
                document.getElementById('deck-b-name').textContent = track.name;
                document.getElementById('deck-b-bpm').textContent = track.bpm;
                showNotification(`Loaded "${track.name}" into Deck B`);
            }
        }

        function toggleDeckPlay(deckLetter) {
            const deck = deckLetter === 'A' ? deckA : deckB;
            if (!deck.track) {
                showNotification(`Please load a track into Deck ${deckLetter} first.`);
                return;
            }

            if (deck.isPlaying) {
                pauseDeck(deckLetter);
            } else {
                playDeck(deckLetter);
            }
        }

        function playDeck(deckLetter) {
            const deck = deckLetter === 'A' ? deckA : deckB;
            if (!deck.track || deck.isPlaying) return;

            const ctx = getAudioContext();
            const targetBpm = parseFloat(document.getElementById('target-bpm').value) || 120;
            const autoSpeed = targetBpm / deck.estimatedBpm;

            deck.source = ctx.createBufferSource();
            deck.source.buffer = deck.track.buffer;
            deck.source.playbackRate.value = autoSpeed * deck.speed;

            deck.gainNode = ctx.createGain();
            deck.gainNode.gain.value = deck.vol;

            deck.source.connect(deck.gainNode);
            deck.gainNode.connect(ctx.destination);

            const offset = deck.pausedAt % deck.track.duration;
            deck.startedAt = ctx.currentTime;
            deck.source.start(0, offset);
            
            deck.isPlaying = true;
            document.getElementById(`deck-${deckLetter.toLowerCase()}-play-btn`).textContent = `⏸ Pause Deck ${deckLetter}`;
            document.getElementById(`deck-${deckLetter.toLowerCase()}-play-btn`).className = "flex-1 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold py-2 rounded-xl transition";
            showNotification(`Deck ${deckLetter} Playing`);
        }

        function pauseDeck(deckLetter) {
            const deck = deckLetter === 'A' ? deckA : deckB;
            if (!deck.isPlaying || !deck.source) return;

            const ctx = getAudioContext();
            try {
                deck.source.stop();
            } catch(e) {}

            const targetBpm = parseFloat(document.getElementById('target-bpm').value) || 120;
            const autoSpeed = targetBpm / deck.estimatedBpm;
            const elapsed = (ctx.currentTime - deck.startedAt) * (autoSpeed * deck.speed);
            deck.pausedAt = (deck.pausedAt + elapsed) % deck.track.duration;
            deck.isPlaying = false;

            document.getElementById(`deck-${deckLetter.toLowerCase()}-play-btn`).textContent = `▶ Play Deck ${deckLetter}`;
            document.getElementById(`deck-${deckLetter.toLowerCase()}-play-btn`).className = "flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-xl transition";
            showNotification(`Deck ${deckLetter} Paused at ${deck.pausedAt.toFixed(1)}s`);
        }

        function stopDeck(deckLetter) {
            const deck = deckLetter === 'A' ? deckA : deckB;
            if (deck.source) {
                try { deck.source.stop(); } catch(e) {}
            }
            deck.isPlaying = false;
            deck.pausedAt = 0;
            document.getElementById(`deck-${deckLetter.toLowerCase()}-play-btn`).textContent = `▶ Play Deck ${deckLetter}`;
            document.getElementById(`deck-${deckLetter.toLowerCase()}-play-btn`).className = "flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-xl transition";
        }

        function updateDeckSpeed(deckLetter, val) {
            const deck = deckLetter === 'A' ? deckA : deckB;
            deck.speed = parseFloat(val);
            if (deck.isPlaying && deck.source) {
                const targetBpm = parseFloat(document.getElementById('target-bpm').value) || 120;
                const autoSpeed = targetBpm / deck.estimatedBpm;
                deck.source.playbackRate.setValueAtTime(autoSpeed * deck.speed, audioCtx.currentTime);
            }
        }

        function updateDeckVolume(deckLetter, val) {
            const deck = deckLetter === 'A' ? deckA : deckB;
            deck.vol = parseFloat(val);
            if (deck.gainNode && audioCtx) {
                deck.gainNode.gain.setValueAtTime(deck.vol, audioCtx.currentTime);
            }
        }

        function stopAllPlayback() {
            stopDeck('A');
            stopDeck('B');
            showNotification("All playback stopped.");
        }

        // Export Mixed Audio to WAV
        async function exportMix() {
            if (!deckA.track && !deckB.track) {
                showNotification("No tracks loaded to export.");
                return;
            }

            showNotification("Rendering mix for download...");
            const targetBpm = parseFloat(document.getElementById('target-bpm').value) || 120;

            let maxDuration = 0;
            if (deckA.track) {
                const spA = (targetBpm / deckA.estimatedBpm) * deckA.speed;
                maxDuration = Math.max(maxDuration, deckA.track.duration / spA);
            }
            if (deckB.track) {
                const spB = (targetBpm / deckB.estimatedBpm) * deckB.speed;
                maxDuration = Math.max(maxDuration, deckB.track.duration / spB);
            }

            const sampleRate = 44100;
            const offlineCtx = new OfflineAudioContext(2, sampleRate * (maxDuration + 1), sampleRate);

            if (deckA.track) {
                const sourceA = offlineCtx.createBufferSource();
                sourceA.buffer = deckA.track.buffer;
                sourceA.playbackRate.value = (targetBpm / deckA.estimatedBpm) * deckA.speed;
                const gainA = offlineCtx.createGain();
                gainA.gain.value = deckA.vol;
                sourceA.connect(gainA);
                gainA.connect(offlineCtx.destination);
                sourceA.start(0);
            }

            if (deckB.track) {
                const sourceB = offlineCtx.createBufferSource();
                sourceB.buffer = deckB.track.buffer;
                sourceB.playbackRate.value = (targetBpm / deckB.estimatedBpm) * deckB.speed;
                const gainB = offlineCtx.createGain();
                gainB.gain.value = deckB.vol;
                sourceB.connect(gainB);
                gainB.connect(offlineCtx.destination);
                sourceB.start(0); // Exports both tracks starting together from top, matching user's synchronized beat structure
            }

            try {
                const renderedBuffer = await offlineCtx.startRendering();
                const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'mega-mix-remix.wav';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showNotification("Mix successfully exported as WAV!");
            } catch (err) {
                console.error(err);
                showNotification("Export failed.");
            }
        }

        function bufferToWave(abuffer, len) {
            const numOfChan = abuffer.numberOfChannels;
            const length = len * numOfChan * 2 + 44;
            const buffer = new ArrayBuffer(length);
            const view = new DataView(buffer);
            let channels = [], sample, offset = 0, pos = 0;

            function writeString(str) {
                for (let i = 0; i < str.length; i++) view.setUint8(pos++, str.charCodeAt(i));
            }

            writeString('RIFF');
            view.setUint32(pos, length - 8, true); pos += 4;
            writeString('WAVE');
            writeString('fmt ');
            view.setUint32(pos, 16, true); pos += 4;
            view.setUint16(pos, 1, true); pos += 2;
            view.setUint16(pos, numOfChan, true); pos += 2;
            view.setUint32(pos, abuffer.sampleRate, true); pos += 4;
            view.setUint32(pos, abuffer.sampleRate * 2 * numOfChan, true); pos += 4;
            view.setUint16(pos, numOfChan * 2, true); pos += 2;
            view.setUint16(pos, 16, true); pos += 2;
            writeString('data');
            view.setUint32(pos, length - pos - 4, true); pos += 4;

            for (let i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

            while (pos < length) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
                    view.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }
    </script>
</body>
</html>
