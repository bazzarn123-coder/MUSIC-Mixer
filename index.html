<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Mix Remix Studio</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        input[type="range"] { accent-color: #3b82f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2 rounded-lg text-xl font-black">🎧</div>
            <div>
                <h1 class="text-xl font-bold tracking-wider">MEGA MIX REMIX STUDIO</h1>
                <p class="text-xs text-slate-400">Import, beat-match, overlap, and export your custom remixes</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button id="master-play-btn" onclick="toggleMasterPlay()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg font-bold transition shadow">
                ▶ Play All
            </button>
            <button onclick="exportMix()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg font-bold transition shadow">
                💾 Export WAV Mix
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 max-w-7xl mx-auto w-full">
        
        <!-- Left Column: Track Library & Upload -->
        <div class="lg:col-span-1 bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 flex flex-col space-y-4">
            <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">Track Library</h2>
            
            <!-- Upload Box -->
            <label class="border-2 border-dashed border-slate-600 hover:border-blue-500 rounded-xl p-6 text-center cursor-pointer transition block bg-slate-900/40">
                <input type="file" id="audio-file-input" accept="audio/*" multiple class="hidden" onchange="handleFileUpload(event)">
                <div class="text-3xl mb-2">📂</div>
                <p class="text-sm font-medium text-slate-300">Click to upload songs</p>
                <p class="text-xs text-slate-500 mt-1">MP3, WAV, M4A, AAC, FLAC</p>
            </label>

            <!-- Loaded Tracks List -->
            <div id="track-library" class="flex-1 overflow-y-auto space-y-2 max-h-[400px]">
                <p class="text-xs text-slate-500 text-center py-6">No tracks uploaded yet.</p>
            </div>
        </div>

        <!-- Right Column: Timeline & Mixer -->
        <div class="lg:col-span-3 flex flex-col space-y-6">
            
            <!-- Timeline / Arranger -->
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 flex flex-col space-y-3">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h2 class="text-lg font-semibold text-slate-200">Timeline Arranger (Overlap & Beat-Match)</h2>
                    <span id="timeline-status" class="text-xs text-slate-400">Ready</span>
                </div>
                
                <div id="timeline-tracks" class="space-y-3 min-h-[160px] p-2 bg-slate-900/60 rounded-xl border border-slate-800">
                    <p class="text-xs text-slate-500 text-center py-10">Add tracks from your library to the timeline to mix them.</p>
                </div>
            </div>

            <!-- Master Mixer & Controls -->
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="text-xs font-semibold text-slate-400 block mb-1">Master Volume</label>
                    <input type="range" id="master-volume" min="0" max="1" step="0.05" value="0.9" oninput="updateMasterVolume(this.value)" class="w-full">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-400 block mb-1">Global BPM Sync</label>
                    <input type="number" id="global-bpm" value="120" class="bg-slate-900 border border-slate-700 rounded px-3 py-1 w-full text-white text-sm" placeholder="120">
                </div>
                <div class="flex items-end">
                    <button onclick="stopAll()" class="w-full bg-red-600/80 hover:bg-red-600 text-white font-bold py-2 rounded-lg text-sm transition">
                        ⏹ Stop All Playback
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Notification Modal / Status -->
    <div id="status-banner" class="fixed bottom-4 right-4 bg-slate-900 border border-slate-700 text-slate-200 px-4 py-3 rounded-xl shadow-2xl hidden z-50 text-sm"></div>

    <script>
        let audioCtx = null;
        let libraryTracks = []; // { id, name, buffer, duration }
        let timelineTracks = []; // { instanceId, trackId, startTime, volume, bpm, playbackRate }
        let activeSources = [];
        let isPlaying = false;
        let playbackStartTime = 0;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function showNotification(msg, duration = 3000) {
            const banner = document.getElementById('status-banner');
            banner.textContent = msg;
            banner.classList.remove('hidden');
            setTimeout(() => { banner.classList.add('hidden'); }, duration);
        }

        // Handle File Uploads
        async function handleFileUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            showNotification(`Loading ${files.length} file(s)...`);
            const ctx = getAudioContext();

            for (let file of files) {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
                    
                    const trackObj = {
                        id: 'track_' + Math.random().toString(36).substr(2, 9),
                        name: file.name,
                        buffer: audioBuffer,
                        duration: audioBuffer.duration
                    };

                    libraryTracks.push(trackObj);
                    renderLibrary();
                    showNotification(`Loaded: ${file.name}`);
                } catch (err) {
                    console.error("Error decoding audio:", err);
                    showNotification(`Failed to load ${file.name}. Invalid or unsupported format.`);
                }
            }
            event.target.value = '';
        }

        function renderLibrary() {
            const libEl = document.getElementById('track-library');
            if (libraryTracks.length === 0) {
                libEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">No tracks uploaded yet.</p>`;
                return;
            }

            libEl.innerHTML = libraryTracks.map(t => `
                <div class="bg-slate-900/80 border border-slate-700/60 p-3 rounded-xl flex items-center justify-between">
                    <div class="overflow-hidden mr-2">
                        <p class="text-sm font-medium text-slate-200 truncate" title="${t.name}">${t.name}</p>
                        <p class="text-xs text-slate-400">${t.duration.toFixed(1)}s</p>
                    </div>
                    <button onclick="addToTimeline('${t.id}')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold shrink-0 transition">
                        + Add
                    </button>
                </div>
            `).join('');
        }

        function addToTimeline(trackId) {
            const track = libraryTracks.find(t => t.id === trackId);
            if (!track) return;

            const instance = {
                instanceId: 'inst_' + Math.random().toString(36).substr(2, 9),
                trackId: track.id,
                name: track.name,
                startTime: timelineTracks.length * 4, // Stagger by 4 seconds by default for overlapping mix
                volume: 1.0,
                playbackRate: 1.0
            };

            timelineTracks.push(instance);
            renderTimeline();
            showNotification(`Added ${track.name} to timeline.`);
        }

        function removeFromTimeline(instanceId) {
            timelineTracks = timelineTracks.filter(i => i.instanceId !== instanceId);
            renderTimeline();
        }

        function renderTimeline() {
            const tEl = document.getElementById('timeline-tracks');
            if (timelineTracks.length === 0) {
                tEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-10">Add tracks from your library to the timeline to mix them.</p>`;
                return;
            }

            tEl.innerHTML = timelineTracks.map((inst, idx) => `
                <div class="bg-slate-800 border border-slate-700 p-3 rounded-xl flex flex-col md:flex-row items-center justify-between gap-4">
                    <div class="w-full md:w-1/3 overflow-hidden">
                        <span class="text-xs font-bold text-blue-400 block">Deck ${idx + 1}</span>
                        <p class="text-sm font-medium text-slate-200 truncate">${inst.name}</p>
                    </div>
                    
                    <div class="flex items-center space-x-4 w-full md:w-2/3 justify-between">
                        <div>
                            <label class="text-[10px] text-slate-400 block">Start Delay (s)</label>
                            <input type="number" step="0.5" min="0" value="${inst.startTime}" onchange="updateInstance('${inst.instanceId}', 'startTime', this.value)" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs w-20 text-white">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 block">Volume</label>
                            <input type="range" min="0" max="1" step="0.05" value="${inst.volume}" oninput="updateInstance('${inst.instanceId}', 'volume', this.value)" class="w-24">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 block">Beat/Speed</label>
                            <input type="number" step="0.05" min="0.5" max="2.0" value="${inst.playbackRate}" onchange="updateInstance('${inst.instanceId}', 'playbackRate', this.value)" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs w-16 text-white">
                        </div>
                        <button onclick="removeFromTimeline('${inst.instanceId}')" class="text-red-400 hover:text-red-300 text-sm font-bold px-2 py-1">✕</button>
                    </div>
                </div>
            `).join('');
        }

        function updateInstance(instanceId, field, value) {
            const inst = timelineTracks.find(i => i.instanceId === instanceId);
            if (inst) {
                inst[field] = parseFloat(value);
            }
        }

        function stopAll() {
            activeSources.forEach(source => {
                try { source.stop(); } catch(e) {}
            });
            activeSources = [];
            isPlaying = false;
            document.getElementById('master-play-btn').textContent = "▶ Play All";
            showNotification("Playback stopped.");
        }

        function toggleMasterPlay() {
            if (isPlaying) {
                stopAll();
                return;
            }

            if (timelineTracks.length === 0) {
                showNotification("Please add tracks to the timeline first.");
                return;
            }

            const ctx = getAudioContext();
            stopAll();

            isPlaying = true;
            document.getElementById('master-play-btn').textContent = "⏹ Stop Mix";
            playbackStartTime = ctx.currentTime;

            timelineTracks.forEach(inst => {
                const track = libraryTracks.find(t => t.id === inst.trackId);
                if (!track) return;

                const source = ctx.createBufferSource();
                source.buffer = track.buffer;
                source.playbackRate.value = inst.playbackRate;

                const gainNode = ctx.createGain();
                gainNode.gain.value = inst.volume;

                source.connect(gainNode);
                gainNode.connect(ctx.destination);

                const scheduleTime = playbackStartTime + inst.startTime;
                source.start(scheduleTime);
                activeSources.push(source);
            });

            showNotification("Playing mixed tracks...");
        }

        function updateMasterVolume(val) {
            // Master volume can be piped through a master gain node if desired
        }

        // Export Mixed Audio to WAV
        async function exportMix() {
            if (timelineTracks.length === 0) {
                showNotification("No tracks on timeline to export.");
                return;
            }

            showNotification("Rendering mix for export... Please wait.");

            // Calculate max duration
            let maxDuration = 0;
            timelineTracks.forEach(inst => {
                const track = libraryTracks.find(t => t.id === inst.trackId);
                if (track) {
                    const dur = (track.duration / inst.playbackRate) + inst.startTime;
                    if (dur > maxDuration) maxDuration = dur;
                }
            });

            const sampleRate = 44100;
            const offlineCtx = new OfflineAudioContext(2, sampleRate * maxDuration, sampleRate);

            timelineTracks.forEach(inst => {
                const track = libraryTracks.find(t => t.id === inst.trackId);
                if (!track) return;

                const source = offlineCtx.createBufferSource();
                source.buffer = track.buffer;
                source.playbackRate.value = inst.playbackRate;

                const gainNode = offlineCtx.createGain();
                gainNode.gain.value = inst.volume;

                source.connect(gainNode);
                gainNode.connect(offlineCtx.destination);

                source.start(inst.startTime);
            });

            try {
                const renderedBuffer = await offlineCtx.startRendering();
                const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
                
                const url = URL.createObjectURL(wavBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'mega-mix-remix.wav';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                showNotification("Mix exported successfully as WAV!");
            } catch (err) {
                console.error("Export error:", err);
                showNotification("Error exporting mix.");
            }
        }

        // Helper to encode AudioBuffer to WAV Blob
        function bufferToWave(abuffer, len) {
            const numOfChan = abuffer.numberOfChannels;
            const length = len * numOfChan * 2 + 44;
            const buffer = new ArrayBuffer(length);
            const view = new DataView(buffer);
            let channels = [];
            let sample;
            let offset = 0;
            let pos = 0;

            function writeString(str) {
                for (let i = 0; i < str.length; i++) {
                    view.setUint8(pos++, str.charCodeAt(i));
                }
            }

            writeString('RIFF');
            view.setUint32(pos, length - 8, true); pos += 4;
            writeString('WAVE');
            writeString('fmt ');
            view.setUint32(pos, 16, true); pos += 4;
            view.setUint16(pos, 1, true); pos += 2;
            view.setUint16(pos, numOfChan, true); pos += 2;
            view.setUint32(pos, abuffer.sampleRate, true); pos += 4;
            view.setUint32(pos, abuffer.sampleRate * 2 * numOfChan, true); pos += 4;
            view.setUint16(pos, numOfChan * 2, true); pos += 2;
            view.setUint16(pos, 16, true); pos += 2;
            writeString('data');
            view.setUint32(pos, length - pos - 4, true); pos += 4;

            for (let i = 0; i < abuffer.numberOfChannels; i++) {
                channels.push(abuffer.getChannelData(i));
            }

            while (pos < length) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
                    view.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }
    </script>
</body>
</html>
